<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f3" />
    <meta
      name="description"
      content="A calm, clear workspace for restaurant teams."
    />
    <title>Restaurant operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Temporary Android console. Remove when the plus-icon crash is fixed. -->
    <script>
      if (/Android/i.test(navigator.userAgent)) {
        const saved = [];
        window.addEventListener("error", (event) => { saved.push(event.message); });
        window.addEventListener("unhandledrejection", (event) => { saved.push(String(event.reason)); });
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/eruda";
        script.onload = () => {
          window.eruda.init();
          saved.forEach((entry) => console.error(entry));
        };
        document.head.appendChild(script);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
